
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zemen Bank | Customer Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // `brand` reads the CSS variables below, so the wizard's colour can switch at runtime
    // (green for Interest-Free Banking products — see [data-theme="ifb"]).
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: 'rgb(var(--brand) / <alpha-value>)',
              dark: 'rgb(var(--brand-dark) / <alpha-value>)',
              50: 'rgb(var(--brand-50) / <alpha-value>)',
              100: 'rgb(var(--brand-100) / <alpha-value>)',
              200: 'rgb(var(--brand-200) / <alpha-value>)',
            },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arial:wght@100;300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* Brand colour as space-separated RGB so Tailwind opacity modifiers (bg-brand/10) work */
    :root {
      --brand: 237 28 36;        /* #ed1c24 Zemen red */
      --brand-dark: 176 26 58;   /* #B01A3A */
      --brand-50: 254 242 242;
      --brand-100: 254 226 226;
      --brand-200: 254 202 202;
    }
    /* Interest-Free Banking (IFB) product selected */
    [data-theme="ifb"] {
      --brand: 0 132 61;         /* #00843D IFB green */
      --brand-dark: 0 102 48;    /* #006630 */
      --brand-50: 240 253 244;
      --brand-100: 220 252 231;
      --brand-200: 187 247 208;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }
    .zemen-gradient {
      background: linear-gradient(135deg, rgb(var(--brand)) 0%, rgb(var(--brand)) 100%);
    }
    .red-gradient {
      background: linear-gradient(135deg, #ed1c24 0%, #ed1c24 100%);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #d1d1d1;
      border-radius: 10px;
    }
    .otp-input:focus {
      border-color: rgb(var(--brand));
      box-shadow: 0 0 0 2px rgb(var(--brand) / 0.2);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes reveal-sweep {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }
    .animate-fade-in {
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    html {
      scroll-behavior: smooth;
    }
    /* Disable focus ring for mouse users, keep for keyboard */
    :focus:not(:focus-visible) {
      outline: none;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react",
    "sonner": "https://esm.sh/sonner@1.7.1?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
