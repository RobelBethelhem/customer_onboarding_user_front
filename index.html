
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zemen Bank | Customer Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arial:wght@100;300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }
    .zemen-gradient {
      background: linear-gradient(135deg, #ed1c24 0%, #ed1c24 100%);
    }
    .red-gradient {
      background: linear-gradient(135deg, #ed1c24 0%, #ed1c24 100%);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #d1d1d1;
      border-radius: 10px;
    }
    .otp-input:focus {
      border-color: #ed1c24;
      box-shadow: 0 0 0 2px rgba(207, 46, 46, 0.2);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes reveal-sweep {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }
    .animate-fade-in {
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    html {
      scroll-behavior: smooth;
    }
    /* Disable focus ring for mouse users, keep for keyboard */
    :focus:not(:focus-visible) {
      outline: none;
    }
  </style>
